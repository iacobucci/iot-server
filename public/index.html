<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Controllo Lampadina</title>
	<style>
		body {
			font-family: sans-serif;
			text-align: center;
			margin-top: 40px;
		}

		button,
		input {
			font-size: 20px;
			margin: 20px;
			padding: 30px;
		}
	</style>
</head>

<body>
	<h1>Lampadina</h1>

	<form method="post" action="/power">
		<input type="hidden" name="power" value="switch" />
		<button type="submit">on/off</button>
	</form>

	<form method="get" action="/status">
		<button type="submit">Stato</button>
	</form>

	<form method="get" action="/set">
		<div>
			<input type="range" name="brightness" step="0.1" min="0" max="1" value="0.5" />
			<input type="hidden" name="power" value="on" />
		</div>
		<button type="submit">Invia</button>
	</form>
</body>

</html>
